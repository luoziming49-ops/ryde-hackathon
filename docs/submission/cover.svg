<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Ryde Dispute AI — Two sides. One inspectable decision.</title>
  <desc id="desc">Digital Native / Ryde. Rider Advocate, Driver Advocate and a guarded Judge review sample evidence. Two dispute categories, simulation and explicit Live API, with no payments executed.</desc>
  <rect width="1920" height="1080" fill="#f5f5f7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <rect x="96" y="78" width="12" height="34" rx="6" fill="#0066cc"/>
    <text x="128" y="105" fill="#0066cc" font-size="26" font-weight="600" letter-spacing="2">DIGITAL NATIVE / RYDE</text>
    <text x="96" y="280" fill="#1d1d1f" font-size="112" font-weight="700" letter-spacing="-4">Two sides.</text>
    <text x="96" y="407" fill="#1d1d1f" font-size="100" font-weight="700" letter-spacing="-4">One inspectable decision.</text>
    <text x="102" y="503" fill="#0066cc" font-size="32" font-weight="600">Ryde Dispute AI</text>
    <text x="102" y="560" fill="#5b5b61" font-size="30">Evidence-backed dispute resolution with transparent multi-agent review.</text>
    <g fill="#ffffff" stroke="#dedee3" stroke-width="2">
      <rect x="96" y="654" width="552" height="235" rx="28"/>
      <rect x="684" y="654" width="552" height="235" rx="28"/>
      <rect x="1272" y="654" width="552" height="235" rx="28"/>
    </g>
    <g fill="#0066cc" font-size="24" font-weight="600">
      <text x="128" y="705">01</text><text x="716" y="705">02</text><text x="1304" y="705">03</text>
    </g>
    <g fill="#1d1d1f" font-size="32" font-weight="600">
      <text x="128" y="763">Rider Advocate</text><text x="716" y="763">Driver Advocate</text><text x="1304" y="763">Guarded Judge</text>
    </g>
    <g fill="#5b5b61" font-size="25">
      <text x="128" y="819">Build a case from cited evidence.</text>
      <text x="716" y="819">Make the other position visible.</text>
      <text x="1304" y="819">Explain a rule-bound outcome.</text>
    </g>
    <path d="M96 944H1824" stroke="#dedee3" stroke-width="2"/>
    <text x="96" y="1000" fill="#5b5b61" font-size="25">Two dispute categories</text>
    <text x="498" y="1000" fill="#5b5b61" font-size="25">Sample evidence</text>
    <text x="880" y="1000" fill="#5b5b61" font-size="25">Simulation + explicit Live API</text>
    <text x="1488" y="1000" fill="#5b5b61" font-size="25">No payments</text>
  </g>
</svg>
