<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Ryde Dispute AI — Make uncertainty visible</title>
  <desc id="desc">Unofficial hackathon prototype for two dispute categories. Rider Advocate and Driver Advocate present reported accounts; a guarded Judge keeps unresolved facts open. Matching oral accounts are not independently verified facts. Preset sample cases, no support dispatch and no payments.</desc>
  <rect width="1920" height="1080" fill="#f7f8fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <rect x="96" y="78" width="12" height="34" rx="6" fill="#E93864"/>
    <text x="128" y="105" fill="#C72D55" font-size="26" font-weight="600" letter-spacing="2">DIGITAL NATIVE / RYDE</text>
    <rect x="1424" y="66" width="400" height="62" rx="31" fill="#fff0f4"/>
    <text x="1460" y="107" fill="#C72D55" font-size="28" font-weight="600">Hackathon prototype</text>
    <text x="96" y="280" fill="#31373E" font-size="112" font-weight="700" letter-spacing="-4">Two sides.</text>
    <text x="96" y="407" fill="#31373E" font-size="100" font-weight="700" letter-spacing="-4">Make uncertainty visible.</text>
    <text x="102" y="503" fill="#C72D55" font-size="32" font-weight="600">Ryde Dispute AI</text>
    <text x="102" y="560" fill="#606873" font-size="30">Evidence-led dispute review with transparent multi-agent reasoning.</text>
    <g fill="#ffffff" stroke="#e1e3e7" stroke-width="2">
      <rect x="96" y="654" width="552" height="235" rx="28"/>
      <rect x="684" y="654" width="552" height="235" rx="28"/>
      <rect x="1272" y="654" width="552" height="235" rx="28"/>
    </g>
    <g fill="#C72D55" font-size="24" font-weight="600"><text x="128" y="705">01</text><text x="716" y="705">02</text><text x="1304" y="705">03</text></g>
    <g fill="#31373E" font-size="32" font-weight="600"><text x="128" y="763">Rider Advocate</text><text x="716" y="763">Driver Advocate</text><text x="1304" y="763">Guarded Judge</text></g>
    <g fill="#606873" font-size="25">
      <text x="128" y="819">Represent the rider's account.</text><text x="716" y="819">Represent the driver's account.</text><text x="1304" y="819">Keep unresolved facts open.</text>
    </g>
    <path d="M96 944H1824" stroke="#e1e3e7" stroke-width="2"/>
    <text x="96" y="996" fill="#606873" font-size="24">Preset sample cases</text>
    <text x="498" y="996" fill="#606873" font-size="24">Reported ≠ verified</text>
    <text x="900" y="996" fill="#606873" font-size="24">Review flag, no dispatch</text>
    <text x="1500" y="996" fill="#606873" font-size="24">No payments</text>
    <text x="96" y="1044" fill="#606873" font-size="21">Not an official Ryde release · Demonstration evidence and policies</text>
  </g>
</svg>
